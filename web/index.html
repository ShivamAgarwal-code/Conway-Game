<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conway's Game of Life</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --cell: #3fb950;
    --grid: #21262d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 18px 24px 8px;
  }
  h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
  main {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 16px 24px 24px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .board-wrap {
    flex: 1 1 480px;
    min-width: 320px;
  }
  canvas {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
  aside {
    flex: 0 0 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, select {
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type="range"] { width: 100%; }
  .stats { font-size: 0.85rem; line-height: 1.7; }
  .stats b { color: var(--accent); }
  .hint { font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
  a { color: var(--accent); }
  select { width: 100%; }
</style>
</head>
<body>
<header>
  <h1>Conway's Game of Life</h1>
  <p>A zero-player cellular automaton. Click cells to toggle them, then press play.</p>
</header>
<main>
  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>
  <aside>
    <div class="row">
      <button id="playBtn" class="primary">▶ Play</button>
      <button id="stepBtn">Step</button>
      <button id="clearBtn">Clear</button>
      <button id="randomBtn">Random</button>
    </div>
    <div>
      <label for="pattern">Load pattern</label>
      <select id="pattern">
        <option value="">— choose —</option>
        <option value="glider">Glider</option>
        <option value="lwss">Lightweight spaceship</option>
        <option value="blinker">Blinker</option>
        <option value="toad">Toad</option>
        <option value="beacon">Beacon</option>
        <option value="pulsar">Pulsar</option>
        <option value="gun">Gosper glider gun</option>
        <option value="rpentomino">R-pentomino</option>
        <option value="acorn">Acorn</option>
        <option value="diehard">Diehard</option>
      </select>
    </div>
    <div>
      <label for="speed">Speed: <span id="speedVal">12</span> gen/s</label>
      <input type="range" id="speed" min="1" max="60" value="12" />
    </div>
    <div>
      <label for="cellSize">Cell size: <span id="cellVal">12</span>px</label>
      <input type="range" id="cellSize" min="4" max="30" value="12" />
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin:0;color:var(--text)">
      <input type="checkbox" id="wrap" checked /> Wrap edges (toroidal)
    </label>
    <div class="stats">
      Generation <b id="genStat">0</b><br />
      Population <b id="popStat">0</b>
    </div>
    <div class="hint">
      Rule B3/S23: a live cell survives with 2–3 live neighbours; a dead cell is
      born with exactly 3. Drag on the grid to paint cells.
    </div>
  </aside>
</main>
<script src="life.js"></script>
<script src="app.js"></script>
</body>
</html>
